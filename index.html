3:[20,5,"1 baguette;500 g tomates mûres;2 gousses ail;1 bouquet basilic;4 c. à soupe huile d'olive;1 c. à café vinaigre balsamique;sel;poivre","Préchauffer le four à 200 °C. Couper la baguette en 12 tranches d'1 cm environ.|Disposer les tranches sur une plaque, les arroser d'un peu d'huile d'olive et les faire dorer 5 minutes, en les retournant à mi-cuisson.|Couper les tomates en petits dés, retirer l'excédent de jus et de graines. Les mettre dans un saladier.|Ciseler le basilic. Ajouter à la tomate avec le reste de l'huile, le vinaigre, le sel et le poivre. Mélanger et laisser reposer 10 minutes.|Frotter chaque tranche de pain grillé avec une gousse d'ail coupée en deux.|Garnir de tomates juste avant de servir, pour que le pain reste croustillant."],
4:[60,45,"400 g spaghetti;400 g bœuf haché;1 oignon;1 carotte;1 branche céleri;2 gousses ail;2 c. à soupe concentré de tomate;400 g tomates concassées;100 ml vin rouge;2 c. à soupe huile d'olive;1 feuille laurier;1 c. à café origan;40 g parmesan;sel;poivre","Hacher finement l'oignon, la carotte, le céleri et l'ail.|Chauffer l'huile dans une grande sauteuse. Faire revenir les légumes 5 minutes à feu moyen, jusqu'à ce qu'ils soient tendres.|Ajouter la viande et la faire dorer 5 minutes en l'émiettant à la fourchette.|Ajouter le concentré de tomate et remuer 1 minute. Verser le vin rouge et laisser évaporer 2 minutes.|Ajouter les tomates concassées, le laurier, l'origan, le sel et le poivre. Laisser mijoter à feu doux 45 minutes, à moitié couvert, en remuant de temps en temps.|Cuire les spaghetti dans une grande casserole d'eau bouillante salée, selon le temps indiqué sur le paquet. Garder un peu d'eau de cuisson.|Égoutter les pâtes, les mélanger à la sauce avec un peu d'eau de cuisson pour qu'elle les enrobe bien.|Servir avec le parmesan râpé."],
5:[90,45,"300 g carottes;250 g farine;2 c. à café levure chimique;1 c. à café cannelle;200 g sucre;3 œufs;150 ml huile;80 g noix;200 g fromage frais;100 g beurre mou;100 g sucre glace","Préchauffer le four à 180 °C. Beurrer et fariner un moule de 22 cm.|Éplucher et râper finement les carottes. Concasser les noix.|Fouetter les œufs et le sucre 3 minutes jusqu'à ce que le mélange blanchisse. Verser l'huile en filet.|Mélanger la farine, la levure et la cannelle, puis les ajouter à la préparation. Incorporer les carottes et les noix.|Verser dans le moule et cuire 45 minutes. La lame d'un couteau plantée au centre doit ressortir sèche.|Laisser tiédir 10 minutes, démouler et laisser refroidir complètement sur une grille.|Pour le glaçage, fouetter le beurre mou, le fromage frais et le sucre glace jusqu'à une crème lisse.|Étaler sur le gâteau refroidi. Garder au frais jusqu'au service."],
6:[65,40,"500 ml crème liquide entière;1 gousse vanille;6 jaunes d'œufs;80 g sucre;4 c. à soupe cassonade","Préchauffer le four à 150 °C. Fendre la gousse de vanille et gratter les graines.|Chauffer la crème avec la vanille (gousse et graines) jusqu'au frémissement. Couvrir et laisser infuser 10 minutes.|Fouetter les jaunes avec le sucre, sans faire mousser, jusqu'à ce que le mélange blanchisse légèrement.|Retirer la gousse, puis verser la crème chaude sur les jaunes en fouettant doucement.|Répartir dans 4 ramequins posés dans un plat creux. Verser de l'eau chaude dans le plat, jusqu'à mi-hauteur des ramequins.|Cuire 40 minutes. Les crèmes doivent être prises, mais encore légèrement tremblantes au centre.|Laisser refroidir, puis réfrigérer au moins 4 heures.|Au moment de servir, saupoudrer de cassonade et caraméliser au chalumeau (ou sous le gril du four, très chaud). Laisser durcir 1 minute."],
7:[40,25,"800 g potiron;1 oignon;1 pomme de terre;1 gousse ail;1 c. à soupe huile d'olive;750 ml bouillon de légumes;100 ml crème liquide;1 pincée muscade;4 c. à soupe graines de courge;sel;poivre","Éplucher le potiron, retirer les graines et le couper en cubes. Éplucher la pomme de terre et la couper en morceaux.|Émincer l'oignon et l'ail.|Dans une grande casserole, faire suer l'oignon et l'ail dans l'huile 5 minutes, sans coloration.|Ajouter le potiron et la pomme de terre, puis verser le bouillon. Porter à ébullition.|Cuire 20 à 25 minutes à feu moyen, jusqu'à ce que les légumes soient très tendres.|Mixer jusqu'à obtenir une soupe lisse. Ajouter la crème, la muscade, le sel et le poivre. Réchauffer sans bouillir.|Faire griller les graines de courge à sec 2 minutes. Servir la soupe avec les graines par-dessus."],
8:[30,15,"2 steaks de bœuf;250 g champignons de Paris;1 échalote;1 gousse ail;30 g beurre;1 c. à soupe huile;100 ml bouillon de bœuf;3 c. à soupe crème liquide;1 c. à soupe persil;sel;poivre","Sortir les steaks du frigo 20 minutes avant la cuisson. Les sécher avec du papier absorbant, saler et poivrer.|Nettoyer les champignons avec un linge humide et les couper en lamelles. Émincer l'échalote et l'ail.|Chauffer l'huile dans une poêle bien chaude. Saisir les steaks 2 à 3 minutes par face pour une cuisson saignante, 4 minutes pour à point. Les mettre de côté sous du papier aluminium.|Dans la même poêle, faire fondre le beurre. Faire dorer les champignons 5 minutes à feu vif, sans trop remuer.|Ajouter l'échalote et l'ail et cuire 1 minute.|Verser le bouillon, gratter les sucs au fond de la poêle et laisser réduire de moitié. Ajouter la crème.|Remettre les steaks 1 minute dans la sauce, parsemer de persil et servir."],
9:[80,40,"7 pommes;100 g sucre;60 g beurre;1 pâte feuilletée;1 c. à café cannelle","Préchauffer le four à 180 °C. Éplucher les pommes, les couper en 4 et retirer le cœur.|Dans un moule à manqué allant sur le feu, faire fondre le sucre à feu moyen, sans remuer, jusqu'à obtenir un caramel ambré.|Hors du feu, ajouter le beurre en morceaux et la cannelle. Remuer rapidement.|Ranger les quarts de pommes serrés, côté arrondi vers le fond. Cuire 10 minutes sur feu doux pour les ramollir légèrement.|Poser la pâte feuilletée sur les pommes. Rentrer les bords à l'intérieur du moule et piquer la pâte avec une fourchette.|Cuire au four 30 minutes, jusqu'à ce que la pâte soit dorée.|Laisser tiédir 10 minutes, puis renverser sur un plat, d'un geste rapide. Servir tiède."],
10:[45,25,"300 g riz arborio;300 g champignons;1 oignon;2 gousses ail;1 L bouillon de légumes;100 ml vin blanc;50 g beurre;50 g parmesan;2 c. à soupe huile d'olive;1 c. à soupe persil;sel;poivre","Chauffer le bouillon dans une casserole et le garder à frémissement.|Émincer l'oignon et l'ail. Couper les champignons en lamelles.|Dans une poêle, faire dorer les champignons dans l'huile 5 minutes à feu vif. Saler et réserver.|Dans une grande casserole, faire fondre la moitié du beurre. Faire suer l'oignon 3 minutes, puis ajouter l'ail.|Ajouter le riz et le remuer 2 minutes, jusqu'à ce que les grains deviennent translucides.|Verser le vin blanc et laisser évaporer en remuant.|Ajouter le bouillon louche par louche, en attendant que chaque louche soit absorbée avant d'ajouter la suivante. Remuer souvent pendant 18 à 20 minutes.|Quand le riz est tendre mais encore légèrement ferme, ajouter les champignons, le reste de beurre et le parmesan. Mélanger, couvrir 2 minutes et parsemer de persil."],
11:[35,12,"250 g farine;1 c. à café bicarbonate;1 pincée sel;150 g beurre;100 g sucre roux;80 g sucre;1 œuf;1 c. à café extrait de vanille;200 g pépites de chocolat","Préchauffer le four à 180 °C. Couvrir deux plaques de papier cuisson.|Mélanger la farine, le bicarbonate et le sel.|Dans un grand bol, battre le beurre mou avec les deux sucres jusqu'à obtenir une crème claire.|Ajouter l'œuf et la vanille, puis battre jusqu'à ce que le mélange soit homogène.|Incorporer les ingrédients secs en deux fois, sans trop travailler la pâte. Ajouter les pépites de chocolat.|Former 12 boules de la taille d'une grosse noix. Les poser sur les plaques en les espaçant bien, puis les aplatir légèrement.|Cuire 10 à 12 minutes, jusqu'à ce que les bords soient dorés et le centre encore tendre.|Laisser reposer 5 minutes sur la plaque, puis sur une grille. Ils durcissent en refroidissant."],
12:[45,20,"200 g nouilles ramen;1 L bouillon de poulet;2 c. à soupe sauce soja;1 c. à soupe miso;2 gousses ail;1 c. à café gingembre râpé;2 œufs;100 g champignons;2 oignons nouveaux;1 c. à café huile de sésame;150 g blanc de poulet","Faire bouillir de l'eau et y plonger les œufs 6 minutes et demie. Les refroidir aussitôt dans de l'eau glacée, puis les écaler.|Faire dorer le blanc de poulet 4 minutes par face dans une poêle. Le laisser reposer 5 minutes, puis le trancher.|Émincer l'ail et les champignons. Dans une casserole, faire revenir l'ail et le gingembre 1 minute dans l'huile de sésame.|Verser le bouillon et la sauce soja. Porter à frémissement et cuire 10 minutes avec les champignons.|Délayer le miso dans une louche de bouillon chaud, puis le verser dans la casserole. Ne plus faire bouillir.|Cuire les nouilles dans une autre casserole d'eau, selon le temps du paquet. Les égoutter.|Répartir les nouilles dans 2 bols, verser le bouillon dessus.|Garnir de poulet, d'œuf coupé en deux et d'oignons nouveaux émincés."],
67:[130,90,"1 kg veau (épaule ou tendron);2 carottes;1 oignon;1 clou de girofle;1 bouquet garni;300 g champignons de Paris;40 g beurre;40 g farine;200 ml crème fraîche;1 jaune d'œuf;1 citron;1 L eau;sel;poivre","Couper la viande en gros morceaux. La plonger dans une grande casserole d'eau froide, porter à ébullition et écumer pendant 5 minutes. Égoutter et rincer la viande.|Remettre la viande dans la casserole avec l'eau froide. Ajouter les carottes en rondelles, l'oignon piqué du clou de girofle, le bouquet garni, le sel et le poivre.|Porter à frémissement, puis cuire à feu doux, à couvert, 1 heure 15 à 1 heure 30, jusqu'à ce que la viande soit très tendre.|Pendant ce temps, nettoyer les champignons, les couper en quartiers et les faire revenir 5 minutes dans une poêle avec un peu de beurre. Réserver.|Filtrer le bouillon de cuisson et garder la viande et les carottes au chaud. Retirer l'oignon et le bouquet garni.|Faire fondre le beurre dans une casserole propre, ajouter la farine et remuer 2 minutes sans coloration.|Verser le bouillon petit à petit, en fouettant, jusqu'à obtenir une sauce lisse. Laisser épaissir 10 minutes à feu doux.|Mélanger le jaune d'œuf avec la crème et un peu de sauce chaude, puis verser dans la casserole hors du feu. Ajouter le jus du citron.|Remettre la viande, les carottes et les champignons dans la sauce. Réchauffer sans bouillir et servir avec du riz."]
};

54:[210,165,"1 kg bœuf (paleron ou jumeau);200 g lardons;750 ml vin rouge;300 g carottes;2 oignons;3 gousses ail;2 c. à soupe farine;2 c. à soupe concentré de tomate;1 bouquet garni;250 g champignons;2 c. à soupe huile;20 g beurre;sel;poivre","Couper le bœuf en cubes de 4 cm environ. Bien les sécher avec du papier absorbant, puis saler et poivrer.|Dans une cocotte, faire revenir les lardons à sec 5 minutes. Les réserver, en gardant la graisse dans la cocotte.|Ajouter l'huile. Saisir la viande en plusieurs fois, sans trop remplir la cocotte, jusqu'à ce que chaque face soit bien dorée. Réserver.|Dans la même cocotte, faire suer les oignons émincés et les carottes en rondelles pendant 5 minutes. Ajouter l'ail écrasé.|Remettre la viande et les lardons. Saupoudrer de farine, remuer 2 minutes, puis ajouter le concentré de tomate.|Verser le vin et ajouter le bouquet garni. Porter à frémissement, couvrir et cuire 2 h 30 à feu très doux (ou au four à 150 °C), en remuant de temps en temps.|Nettoyer les champignons, les couper en quartiers et les faire dorer au beurre pendant 5 minutes. Les ajouter à la cocotte 30 minutes avant la fin.|Retirer le bouquet garni, goûter et rectifier le sel et le poivre. La sauce doit être brillante et un peu liée.|Servir avec des pommes de terre vapeur ou des tagliatelles. Le plat est encore meilleur réchauffé le lendemain."],
26:[120,40,"12 feuilles de lasagne;500 g bœuf haché;500 g sauce tomate;60 g beurre;60 g farine;750 ml lait;1 pincée muscade;1 oignon;1 carotte;2 gousses ail;2 c. à soupe huile d'olive;150 g mozzarella;50 g parmesan;sel;poivre","Hacher l'oignon, la carotte et l'ail. Les faire revenir 5 minutes dans l'huile d'olive.|Ajouter la viande et la faire dorer 5 minutes en l'émiettant. Verser la sauce tomate, saler, poivrer et laisser mijoter 30 minutes à feu doux.|Préparer la béchamel : faire fondre le beurre, ajouter la farine et remuer 2 minutes. Verser le lait froid petit à petit en fouettant. Cuire 8 minutes jusqu'à ce que la sauce nappe la cuillère, puis ajouter la muscade, le sel et le poivre.|Préchauffer le four à 180 °C. Couper la mozzarella en tranches.|Dans un plat à gratin, étaler un peu de béchamel, puis poser une couche de feuilles de lasagne.|Recouvrir d'un tiers de la viande, d'un peu de béchamel et de mozzarella. Répéter l'opération pour faire 3 couches.|Terminer par une couche de pâtes, le reste de béchamel, la mozzarella et le parmesan râpé.|Cuire 40 minutes, jusqu'à ce que le dessus soit doré et que ça bouillonne sur les bords.|Laisser reposer 10 minutes avant de couper, pour que les parts se tiennent."],
55:[210,180,"1 kg bœuf (gîte, macreuse ou plat de côtes);500 g carottes;3 poireaux;3 navets;500 g pommes de terre;2 oignons;2 clous de girofle;1 bouquet garni;1 branche céleri;gros sel;poivre en grains;moutarde;cornichons","Mettre la viande dans une grande marmite avec environ 3 litres d'eau froide. Porter à ébullition et écumer soigneusement.|Piquer un oignon de clous de girofle et ajouter les deux oignons, le bouquet garni, le gros sel et quelques grains de poivre.|Baisser le feu et cuire à frémissement 2 heures, à moitié couvert, en écumant de temps en temps.|Pendant ce temps, éplucher les carottes, les navets et les pommes de terre. Laver les poireaux et les ficeler en bottes avec le céleri.|Ajouter les carottes, les navets, les poireaux et le céleri dans le bouillon. Cuire 40 minutes.|Cuire les pommes de terre à part, dans un peu de bouillon, 25 minutes. Elles doivent rester fermes.|Vérifier que la viande est tendre : la pointe d'un couteau doit s'enfoncer sans résistance.|Servir la viande tranchée avec les légumes, un peu de bouillon, de la moutarde, des cornichons et du gros sel. Le bouillon peut être servi à part en soupe."],
69:[80,55,"4 cuisses de poulet;100 g abricots secs;2 oignons;2 gousses ail;1 c. à café cannelle;1 c. à café gingembre;1 c. à café curcuma;1 c. à café cumin;2 c. à soupe huile d'olive;400 ml bouillon de poulet;50 g amandes;1 c. à soupe miel;1 bouquet coriandre;sel;poivre","Mélanger les épices avec une cuillerée d'huile, le sel et le poivre. Frotter les cuisses de poulet avec ce mélange et les laisser mariner 30 minutes.|Émincer les oignons et l'ail.|Dans un tajine ou une cocotte, chauffer le reste d'huile. Faire dorer le poulet 5 minutes par face, puis le réserver.|Faire revenir les oignons 5 minutes. Ajouter l'ail et cuire 1 minute.|Remettre le poulet, verser le bouillon et porter à frémissement. Couvrir et cuire 35 minutes à feu doux.|Ajouter les abricots et le miel. Poursuivre 15 minutes à couvert, jusqu'à ce que la viande se détache de l'os et que la sauce soit sirupeuse.|Faire griller les amandes à sec 2 minutes. Servir le tajine parsemé d'amandes et de coriandre ciselée, avec de la semoule."],
16:[85,60,"4 cuisses de poulet;600 g pommes de terre;500 g carottes;2 oignons;4 gousses ail;2 c. à soupe huile d'olive;1 c. à café paprika;1 c. à café thym;sel;poivre","Préchauffer le four à 200 °C.|Éplucher les pommes de terre et les carottes, puis les couper en gros morceaux. Couper les oignons en quartiers. Laisser l'ail en chemise.|Mélanger les légumes dans un grand plat avec la moitié de l'huile, le sel, le poivre et le thym.|Mélanger le reste d'huile avec le paprika, le sel et le poivre. Frotter les cuisses de poulet avec ce mélange.|Poser le poulet, peau vers le haut, sur les légumes.|Cuire 50 à 60 minutes. Retourner les légumes à mi-cuisson et arroser le poulet avec le jus.|Vérifier la cuisson : le jus qui coule doit être clair, sans trace rose. Laisser reposer 5 minutes avant de servir."],
21:[70,45,"1 pâte brisée;200 g lardons;3 œufs;200 ml crème liquide;150 ml lait;100 g gruyère;1 pincée muscade;sel;poivre","Préchauffer le four à 180 °C. Étaler la pâte dans un moule et la piquer avec une fourchette.|Couvrir la pâte de papier cuisson et de haricots secs, puis la cuire à blanc 10 minutes. Retirer le papier et les haricots.|Faire revenir les lardons à sec dans une poêle 5 minutes, puis les égoutter sur du papier absorbant.|Dans un bol, battre les œufs avec la crème, le lait, la muscade et le poivre. Saler très peu, car les lardons sont déjà salés.|Répartir les lardons et le gruyère râpé sur le fond de tarte.|Verser l'appareil par-dessus.|Cuire 35 minutes, jusqu'à ce que la quiche soit dorée et prise. La laisser tiédir 10 minutes avant de couper."],
19:[75,50,"400 g bœuf haché;400 g haricots rouges;400 g tomates concassées;1 oignon;2 gousses ail;1 poivron rouge;1 c. à soupe concentré de tomate;2 c. à café cumin;1 c. à café paprika fumé;1 c. à café piment en poudre;200 ml bouillon de bœuf;2 c. à soupe huile;150 g riz;sel;poivre","Hacher l'oignon et l'ail. Couper le poivron en petits dés. Égoutter et rincer les haricots rouges.|Chauffer l'huile dans une cocotte. Faire revenir l'oignon et le poivron 5 minutes.|Ajouter l'ail et les épices (cumin, paprika, piment) et remuer 1 minute pour les réveiller.|Ajouter la viande et la faire dorer 5 minutes en l'émiettant.|Ajouter le concentré de tomate, les tomates concassées et le bouillon. Saler et poivrer.|Laisser mijoter 30 minutes à feu doux, à moitié couvert. Ajouter les haricots, puis cuire encore 15 minutes.|Cuire le riz à part. Goûter le chili et rectifier l'assaisonnement, puis servir avec le riz."],
25:[80,50,"2 aubergines;2 courgettes;3 tomates;2 poivrons;1 oignon;3 gousses ail;3 c. à soupe huile d'olive;1 bouquet garni;1 c. à café thym;1 bouquet basilic;sel;poivre","Laver tous les légumes. Les couper en cubes d'environ 2 cm. Émincer l'oignon et l'ail.|Dans une grande cocotte, chauffer une cuillerée d'huile. Faire revenir l'oignon 5 minutes, puis ajouter l'ail.|Faire dorer à part les poivrons 5 minutes, puis les aubergines 7 minutes, puis les courgettes 5 minutes, en ajoutant un peu d'huile à chaque fois. Les ajouter au fur et à mesure dans la cocotte.|Ajouter les tomates coupées, le bouquet garni, le thym, le sel et le poivre.|Couvrir et laisser mijoter 40 minutes à feu doux, en remuant de temps en temps.|Retirer le couvercle les 10 dernières minutes pour faire réduire le jus.|Parsemer de basilic ciselé. Ça se mange chaud ou froid, et c'est encore meilleur le lendemain."],
35:[95,75,"1 kg pommes de terre;400 ml crème liquide;200 ml lait;1 gousse ail;20 g beurre;1 pincée muscade;sel;poivre","Préchauffer le four à 160 °C. Frotter un plat à gratin avec la gousse d'ail coupée en deux, puis le beurrer.|Éplucher les pommes de terre et les couper en rondelles fines (3 mm environ). Ne pas les rincer, l'amidon aide à lier le gratin.|Chauffer le lait et la crème avec la muscade, le sel et le poivre.|Ajouter les pommes de terre dans le mélange chaud et cuire 5 minutes en remuant doucement.|Verser le tout dans le plat et bien l'étaler en lissant le dessus.|Cuire 1 h à 1 h 15, jusqu'à ce que le dessus soit doré et que la lame d'un couteau s'enfonce sans résistance.|Laisser reposer 10 minutes avant de servir."],
20:[95,12,"500 g farine;1 sachet levure de boulanger;300 ml eau tiède;2 c. à soupe huile d'olive;1 c. à café sel;200 g sauce tomate;200 g mozzarella;1 bouquet basilic","Diluer la levure dans l'eau tiède et attendre 5 minutes. Mélanger la farine et le sel, puis ajouter l'eau et l'huile.|Pétrir 10 minutes jusqu'à obtenir une pâte lisse et souple.|Couvrir la pâte d'un linge et la laisser lever 1 heure à température ambiante, jusqu'à ce qu'elle double de volume.|Préchauffer le four à 240 °C, avec la plaque à l'intérieur.|Diviser la pâte en 4. Étaler chaque boule en rond fin sur du papier cuisson, avec les mains ou un rouleau.|Étaler la sauce tomate, ajouter la mozzarella coupée en morceaux et un peu de sel.|Glisser les pizzas sur la plaque chaude et cuire 10 à 12 minutes. Ajouter le basilic et un filet d'huile d'olive à la sortie du four."],
40:[50,22,"200 g chocolat noir;150 g beurre;150 g sucre;3 œufs;80 g farine;1 pincée sel;80 g noix","Préchauffer le four à 180 °C. Chemiser un moule carré de 20 cm de papier cuisson.|Casser le chocolat en morceaux et le faire fondre avec le beurre au bain-marie, en remuant. Laisser tiédir.|Fouetter les œufs avec le sucre pendant 2 minutes, sans chercher à faire mousser.|Verser le chocolat fondu sur les œufs et mélanger.|Ajouter la farine et le sel, puis les noix concassées. Mélanger juste assez pour que la pâte soit homogène.|Verser dans le moule et cuire 20 à 22 minutes. Le centre doit rester un peu mou, avec une croûte fine dessus.|Laisser refroidir complètement dans le moule avant de couper en carrés."],
43:[40,0,"250 g mascarpone;3 œufs;100 g sucre;24 biscuits cuillère;250 ml café fort;2 c. à soupe amaretto;2 c. à soupe cacao","Préparer le café, le laisser refroidir complètement et ajouter l'amaretto (facultatif). Utiliser des œufs très frais, car la crème n'est pas cuite.|Séparer les blancs des jaunes. Fouetter les jaunes avec le sucre jusqu'à ce que le mélange blanchisse.|Ajouter le mascarpone et fouetter jusqu'à obtenir une crème lisse.|Monter les blancs en neige ferme avec une pincée de sel, puis les incorporer délicatement à la crème.|Tremper rapidement les biscuits dans le café, un à un, sans les laisser s'imbiber.|Disposer une couche de biscuits dans un plat, recouvrir de la moitié de la crème. Répéter avec une deuxième couche.|Couvrir et réfrigérer au moins 6 heures. Saupoudrer de cacao au moment de servir."],
44:[100,50,"200 g biscuits sablés;100 g beurre;500 g fromage frais;3 œufs;100 g sucre;150 ml crème fraîche;1 c. à soupe jus de citron;1 c. à café extrait de vanille;2 c. à soupe farine","Préchauffer le four à 160 °C. Sortir le fromage frais et les œufs du frigo 30 minutes avant, pour qu'ils soient à température ambiante.|Mixer ou écraser les biscuits en poudre fine. Les mélanger au beurre fondu.|Tasser ce mélange au fond d'un moule à charnière de 22 cm. Mettre au frais pendant la préparation de la crème.|Fouetter le fromage frais avec le sucre jusqu'à obtenir une crème lisse.|Ajouter les œufs un par un, en fouettant doucement. Incorporer la crème fraîche, le citron, la vanille et la farine.|Verser sur la base de biscuits. Cuire 45 à 50 minutes, jusqu'à ce que les bords soient pris et que le centre tremble légèrement.|Éteindre le four et laisser le gâteau 1 heure dedans, porte entrouverte, pour éviter les fissures.|Laisser refroidir, puis réfrigérer au moins 4 heures avant de démouler."]

64:[20,8,"1 salade verte;4 tranches pain;1 fromage de chèvre;1 c. à soupe miel;1 c. à soupe huile d'olive;1 c. à soupe vinaigre balsamique;20 g noix;sel;poivre","Préchauffer le gril du four. Couper le fromage de chèvre en 4 rondelles épaisses.|Poser les tranches de pain sur une plaque et mettre une rondelle de chèvre sur chacune. Arroser d'un filet de miel.|Passer sous le gril 6 à 8 minutes, jusqu'à ce que le fromage soit doré et fondant.|Laver et essorer la salade. Concasser les noix.|Mélanger l'huile, le vinaigre, le sel et le poivre, puis assaisonner la salade.|Dresser la salade dans 2 assiettes, poser les toasts chauds dessus et parsemer de noix."],
65:[70,50,"800 g oignons;40 g beurre;1 c. à soupe farine;100 ml vin blanc;1 L bouillon;1 feuille laurier;4 tranches pain;100 g gruyère;sel;poivre","Éplucher les oignons et les émincer finement.|Faire fondre le beurre dans une grande casserole. Ajouter les oignons et les faire cuire 25 à 30 minutes à feu doux, en remuant souvent, jusqu'à ce qu'ils soient bien dorés et caramélisés.|Saupoudrer de farine et remuer 1 minute.|Verser le vin blanc et laisser réduire 2 minutes, puis ajouter le bouillon et le laurier. Saler, poivrer et cuire 20 minutes à frémissement.|Préchauffer le gril du four. Faire griller le pain.|Verser la soupe dans des bols allant au four. Poser le pain dessus et recouvrir de gruyère râpé.|Gratiner 5 minutes sous le gril, jusqu'à ce que le fromage soit doré et bouillonnant."],
70:[100,12,"500 g farine;1 sachet levure de boulanger;300 ml eau tiède;2 c. à soupe huile d'olive;1 c. à café sel;200 g sauce tomate;1 courgette;1 poivron;1 oignon rouge;150 g mozzarella;1 c. à café origan","Diluer la levure dans l'eau tiède et attendre 5 minutes. Mélanger la farine et le sel, ajouter l'eau et l'huile, et pétrir 10 minutes.|Laisser lever la pâte sous un linge 1 heure, jusqu'à ce qu'elle double de volume.|Préchauffer le four à 240 °C, avec la plaque à l'intérieur.|Couper la courgette en rondelles fines, le poivron en lanières et l'oignon en lamelles.|Étaler la pâte en un grand rond sur du papier cuisson. Étaler la sauce tomate.|Disposer les légumes et la mozzarella en morceaux, puis saupoudrer d'origan.|Glisser sur la plaque chaude et cuire 10 à 12 minutes, jusqu'à ce que les bords soient dorés."],

74:[40,25,"1 chou-fleur;2 c. à soupe huile d'olive;1 c. à café curcuma;1 c. à café cumin;1 c. à café paprika;1 citron;1 c. à soupe persil;100 g yaourt;sel","Préchauffer le four à 220 °C. Couper le chou-fleur en bouquets de taille similaire.|Mélanger l'huile, le curcuma, le cumin, le paprika et le sel. Enrober les bouquets de ce mélange.|Étaler sur une plaque, sans les serrer, et rôtir 25 minutes en les retournant à mi-cuisson, jusqu'à ce qu'ils soient dorés.|Mélanger le yaourt avec le jus d'un demi-citron et une pincée de sel.|Servir le chou-fleur chaud avec la sauce, du persil ciselé et des quartiers de citron."],

81:[15,8,"500 ml dashi ou bouillon de légumes;2 c. à soupe miso;100 g tofu;1 oignon nouveau;1 c. à café algues wakamé","Couper le tofu en petits cubes. Émincer finement l'oignon nouveau. Réhydrater le wakamé 5 minutes dans l'eau froide, puis l'égoutter.|Chauffer le bouillon dans une casserole jusqu'au frémissement, sans bouillir.|Mettre le miso dans une louche et le délayer avec un peu de bouillon chaud, jusqu'à ce qu'il soit lisse, puis le verser dans la casserole.|Ajouter le tofu et le wakamé et réchauffer 2 minutes, sans faire bouillir (le miso perd son goût).|Servir dans des bols avec l'oignon nouveau."],
82:[30,12,"200 g tofu;200 g brocolis;100 g riz;2 c. à soupe sauce soja;1 gousse ail;1 c. à café gingembre;1 c. à soupe Maïzena;1 c. à soupe huile;1 c. à café huile de sésame","Presser le tofu 10 minutes dans du papier absorbant, avec un poids dessus. Le couper en cubes et les enrober de Maïzena.|Cuire le riz selon le temps du paquet.|Détailler le brocoli en petits bouquets. Hacher l'ail.|Chauffer l'huile dans une poêle antiadhésive. Faire dorer le tofu 6 à 8 minutes sur toutes les faces. Le réserver.|Dans la même poêle, faire sauter le brocoli 4 minutes avec l'ail et le gingembre.|Remettre le tofu, ajouter la sauce soja et 2 cuillerées d'eau. Remuer 1 minute.|Terminer avec l'huile de sésame et servir sur le riz."],

106:[30,10,"6 œufs;3 c. à soupe mayonnaise;1 c. à café moutarde;1 c. à soupe ciboulette;1 pincée paprika;sel;poivre","Plonger les œufs dans l'eau bouillante et les cuire 10 minutes. Les rafraîchir aussitôt dans l'eau froide, puis les écaler.|Couper les œufs en deux dans le sens de la longueur. Retirer délicatement les jaunes et les mettre dans un bol.|Écraser les jaunes à la fourchette avec la mayonnaise, la moutarde, le sel et le poivre, jusqu'à obtenir une crème lisse.|Remplir les blancs avec cette crème, à la cuillère ou avec une poche à douille.|Parsemer de ciboulette ciselée et d'une pincée de paprika. Garder au frais jusqu'au service."],

grp(l,x=>x.a).forEach(([a,it])=>{h+=`<div class="hd">${esc(a)}</div>`+it.map(([x,i])=>`<div class="row"><span class="ck" data-a="gtog" data-v="${i}">${x.d?'✓':''}</span><div>${x.d?'<s>':''}${esc(x.n)} <span style="color:var(--mu)">${esc(x.q)}</span>${x.d?'</s>':''}${x.r?`<small>${esc(x.r)}</small>`:''}</div><span class="x" data-a="gdel" data-v="${i}">×</span></div>`).join('')});
return h+(l.length?`<div class="pd"><span class="lk" data-a="gclr">Effacer les articles cochés</span></div>`:'<p style="padding:24px;color:var(--mu);text-align:center">Votre liste est vide.<br>Ajoutez les ingrédients depuis une recette 🧺</p>')}
function vPlan(){const f=new Date(V.yy,V.my,1),off=(f.getDay()+6)%7,n=new Date(V.yy,V.my+1,0).getDate();
let c=['L','M','M','J','V','S','D'].map(x=>`<div class="w">${x}</div>`).join('')+'<div style="border:0;cursor:default"></div>'.repeat(off);
for(let d=1;d<=n;d++){const k=V.yy+'-'+String(V.my+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),p=S.plan[k]||[];c+=`<div class="dt ${k==V.sel?'sl':''} ${k==TODAY?'to':''}" data-a="sel" data-v="${k}">${d}<br>${p.map(m=>`<i style="background:${SL[m.s]}"></i>`).join('')}</div>`}
const p=S.plan[V.sel]||[];
return `<div style="display:flex;justify-content:space-between;padding:10px 14px;font-weight:600"><span class="x" style="color:var(--bl)" data-a="mv" data-v="-1">‹</span>${new Date(V.yy,V.my,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}<span class="x" style="color:var(--bl)" data-a="mv" data-v="1">›</span></div><div class="cal">${c}</div><div class="hd" style="margin-top:8px">${V.sel}</div>`+(p.length?p.map((m,i)=>{const r=R.find(x=>x.i==m.r);return `<div class="row"><b style="color:${SL[m.s]};width:78px;font-size:13px">${m.s}</b><div data-a="open" data-v="${r.i}">${esc(r.n)}</div><span class="x" data-a="pdel" data-v="${i}">×</span></div>`}).join(''):'<p style="padding:16px;color:var(--mu)">Rien de prévu. Touchez + pour planifier.</p>')}
function vPan(){let h=`<div class="sb" style="display:flex;gap:8px"><input id="pi" placeholder="Ajouter un produit"><button class="btn" style="width:auto;margin:0;padding:0 16px" data-a="padd">+</button></div>`;
grp(S.pan,x=>x.a).forEach(([a,it])=>{h+=`<div class="hd">${esc(a)}</div>`+it.map(([x,i])=>`<div class="row"><div>${esc(x.n)}<small>${x.q?esc(x.q)+' · ':''}Acheté : ${x.b}${x.x?' · Expire : '+x.x:''}</small></div>${x.x&&x.x<TODAY?'<i class="bd">Expiré</i>':''}<span class="x" data-a="pxd" data-v="${i}">×</span></div>`).join('')});return h}
function ads(){$('#ads').innerHTML=S.pr?'':`<div class="ad">📢 Espace publicitaire (bannière AdMob / AdSense) · <a data-a="prem">Retirer les pubs</a></div>`}
function draw(){const T_={rec:'Toutes les recettes',gro:'Ma liste de courses',plan:'Planning des repas',pan:'Garde-manger'};
$('#ht').textContent=T_[V.t];$('#hl').textContent=S.pr?'⭐':'';$('#hr').style.display=V.t=='pan'||V.t=='gro'?'none':'';
$('#mn').innerHTML={rec:vRec,gro:vGro,plan:vPlan,pan:vPan}[V.t]();
$('#nv').innerHTML=[['rec','📖','Recettes'],['gro','🛒','Courses'],['plan','📅','Planning'],['pan','🥫','Garde-manger']].map(x=>`<div class="${V.t==x[0]?'on':''}" data-a="tab" data-v="${x[0]}"><i>${x[1]}</i>${x[2]}</div>`).join('');ads()}
function det(){const r=R.find(x=>x.i==V.rid),k=V.sv/r.s,o=$('#ov'),fv=S.fav.includes(r.i);o.style.display='flex';
o.innerHTML=`<header style="font-size:22px"><b data-a="cl">‹</b><span><span data-a="addg">🧺</span> &nbsp;<span data-a="plan">📅</span> &nbsp;<span data-a="fav">${fv?'❤️':'🤍'}</span></span><span style="width:30px"></span></header><div style="overflow-y:auto;flex:1"><div class="pd"><h2 style="margin:0 0 8px;font-weight:500">${esc(r.n)}</h2><div style="display:flex;gap:12px"><div class="ph" style="width:130px;flex:none">${im(r)}</div><div style="font-size:22px">${star(rr(r),1)}<div style="font-size:14px;color:var(--mu);margin-top:4px">${r.c}</div><label class="lk" style="display:block;margin-top:10px;font-size:14px">📷 Ajouter ma photo<input type="file" accept="image/*" hidden onchange="A.photo(this)"></label></div></div><p style="font-size:14px"><b>Préparation</b> ${r.t-r.k} min • <b>Cuisson</b> ${r.k} min • <b>Total</b> ${r.t} min • <b>Difficulté</b> ${r.d}</p>${nut(r)}</div><div class="tabs"><div class="${V.tb=='i'?'on':''}" data-a="dtab" data-v="i">Ingrédients</div><div class="${V.tb=='s'?'on':''}" data-a="dtab" data-v="s">Étapes</div></div>`+
(V.tb=='i'?`<div class="pd"><div style="display:flex;align-items:center;gap:14px;margin-bottom:8px"><span class="lk">Ajuster</span><span class="x" style="color:var(--bl)" data-a="svc" data-v="-1">−</span><b>${V.sv} portions</b><span class="x" style="color:var(--bl)" data-a="svc" data-v="1">+</span></div>${r.g.map(x=>`<p style="margin:10px 0"><b>${fq(x[0]*k)}</b> ${x[1]} ${esc(x[2])}</p>`).join('')}</div>`:`<div class="pd">${r.st.map((s,i)=>`<p><b style="color:var(--rd)">${i+1}.</b> ${esc(s)}</p>`).join('')}${r.k?`<button class="btn g" data-a="tm" id="tb">⏱ Minuteur de cuisson (${r.k} min)</button>`:''}</div>`)+'</div>'}
function sheet(h){const m=$('#md');m.style.display='flex';m.innerHTML=`<div class="sh">${h}</div>`}
const cm=()=>{$('#md').style.display='none'};
function prem(){sheet(`<h3>⭐ Carnet Premium</h3><p style="margin:6px 0">✓ Aucune publicité<br>✓ Toutes les recettes exclusives (🔒) avec notes santé<br>✓ Recettes personnelles illimitées<br>✓ Synchronisation multi-appareils</p><div class="pl"><div data-a="pp" data-v="m" id="pm">Mensuel<br><b>3,99 €</b>/mois</div><div class="on" data-a="pp" data-v="a" id="pa">Annuel<br><b>24,99 €</b>/an<br><small style="color:var(--rd)">−48 %</small></div></div><button class="btn" data-a="buy">Essayer 7 jours gratuits</button><button class="btn g" data-a="cm">Plus tard</button><p style="font-size:11px;color:var(--mu)">Démo : le paiement est simulé. En production, branchez Stripe / RevenueCat / StoreKit.</p>`)}
function inter(){let n=5;sheet(`<p style="text-align:center;color:var(--mu);font-size:12px">Publicité (interstitiel)</p><div class="ph" style="background:var(--gr);aspect-ratio:2;font-size:20px;display:flex;align-items:center;justify-content:center">📺 Votre annonce ici</div><button class="btn g" id="ib" data-a="cm" disabled>Fermer dans 5 s</button><span class="lk" data-a="prem" style="display:block;text-align:center;margin-top:10px">Passer sans pub avec Premium</span>`);
const iv=setInterval(()=>{n--;const b=$('#ib');if(!b)return clearInterval(iv);if(n>0)b.textContent='Fermer dans '+n+' s';else{b.textContent='Fermer ✕';b.disabled=false;clearInterval(iv)}},1000)}
function psheet(rid){const d=V.sel;sheet(`<h3>Planifier un repas</h3>${rid?'':`<select id="pr">${R.filter(r=>!r.p||S.pr).map(r=>`<option value="${r.i}">${esc(r.n)}</option>`).join('')}</select><br><br>`}<input type="date" id="pd" value="${d}"><br><br><select id="ps">${Object.keys(SL).map(s=>`<option>${s}</option>`).join('')}</select><button class="btn" data-a="pok" data-v="${rid||''}">Ajouter au planning</button>`)}
function asheet(){if(!S.pr&&S.cu.length>=3)return prem();sheet(`<h3>Nouvelle recette</h3><input id="rn" placeholder="Nom"><br><br><textarea id="ri" rows="4" placeholder="Ingrédients (un par ligne)"></textarea><br><br><textarea id="rs" rows="4" placeholder="Étapes (une par ligne)"></textarea><button class="btn" data-a="rok">Enregistrer</button>${S.pr?'':`<p style="font-size:12px;color:var(--mu)">Gratuit : ${3-S.cu.length} recette(s) personnelle(s) restante(s).</p>`}`)}
const A={photo(el){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);try{S.im[V.rid]=c.toDataURL('image/jpeg',.72);localStorage.setItem('rk',JSON.stringify(S));det()}catch(e){delete S.im[V.rid];sheet("<h3>Mémoire pleine</h3><p>Impossible d'enregistrer cette photo sur cet appareil.</p><button class=\"btn\" data-a=\"cm\">OK</button>")}};i.src=rd.result};rd.readAsDataURL(f)},tab(v){V.t=v;draw()},cat(v){V.c=v;draw()},so(){V.so={n:'r',r:'t',t:'s',s:'n'}[V.so];draw()},
open(v){const r=R.find(x=>x.i==v);if(r.p&&!S.pr)return prem();V.rid=+v;V.sv=r.s;V.tb='i';S.op++;sv();det();if(!S.pr&&S.op%3==0)inter()},
cl(){$('#ov').style.display='none';clearInterval(T.iv);draw()},cm,prem,dtab(v){V.tb=v;det()},svc(v){V.sv=Math.max(1,V.sv+ +v);det()},
fav(){const i=V.rid,a=S.fav;a.includes(i)?a.splice(a.indexOf(i),1):a.push(i);sv();det()},rate(v){S.rt[V.rid]=+v;sv();det()},
addg(){const r=R.find(x=>x.i==V.rid),k=V.sv/r.s;r.g.forEach(x=>{const q=fq(x[0]*k)+(x[1]?' '+x[1]:''),e=S.gro.find(y=>y.n==x[2]&&y.q==q&&!y.d);if(!e)S.gro.push({n:x[2],q,a:x[3],r:r.n,d:0})});sv();sheet(`<h3>🧺 Ajouté</h3><p>${r.g.length} ingrédients ajoutés à la liste de courses.</p><button class="btn" data-a="cm">OK</button>`)},
plan(){psheet(V.rid)},pl(){V.t=='rec'?asheet():V.t=='plan'&&psheet()},
pok(v){const r=v||$('#pr').value,d=$('#pd').value||V.sel;(S.plan[d]=S.plan[d]||[]).push({s:$('#ps').value,r:+r});V.sel=d;sv();cm();if(V.t=='plan')draw()},
rok(){const n=$('#rn').value.trim();if(!n)return;const L=id=>$(id).value.split('\n').map(x=>x.trim()).filter(Boolean),x={i:100+Date.now()%1e6,n,e:'🍽️',c:'Plats',r:0,t:30,k:0,s:4,d:'Moyen',g:L('#ri').map(z=>g(0,'',z,'Épicerie')),st:L('#rs')};S.cu.push(x);R.push(x);sv();cm();draw()},
gadd(){const v=$('#gi').value.trim();if(v){S.gro.push({n:v,q:'',a:'Divers',r:'',d:0});sv();draw()}},gtog(v){S.gro[v].d=!S.gro[v].d;sv();draw()},gdel(v){S.gro.splice(v,1);sv();draw()},gclr(){S.gro=S.gro.filter(x=>!x.d);sv();draw()},
padd(){const v=$('#pi').value.trim();if(v){S.pan.push({n:v,q:'',b:TODAY,x:'',a:'Épicerie'});sv();draw()}},pxd(v){S.pan.splice(v,1);sv();draw()},
mv(v){V.my+=+v;if(V.my>11){V.my=0;V.yy++}if(V.my<0){V.my=11;V.yy--}draw()},sel(v){V.sel=v;draw()},pdel(v){S.plan[V.sel].splice(v,1);sv();draw()},
pp(v){$('#pm').classList.toggle('on',v=='m');$('#pa').classList.toggle('on',v=='a')},
buy(){S.pr=1;sv();cm();draw();sheet(`<h3>🎉 Bienvenue en Premium</h3><p>Pubs supprimées et recettes exclusives débloquées.</p><button class="btn" data-a="cm">Super !</button>`)},
tm(){const b=$('#tb'),r=R.find(x=>x.i==V.rid);clearInterval(T.iv);T.l=r.k*60;T.iv=setInterval(()=>{T.l--;const e=$('#tb');if(!e)return clearInterval(T.iv);if(T.l<=0){clearInterval(T.iv);e.textContent='⏰ Terminé !';try{navigator.vibrate(500)}catch(x){}}else e.textContent='⏱ '+Math.floor(T.l/60)+':'+String(T.l%60).padStart(2,'0')},1000)},bk(){}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v)});
draw();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body></html>
